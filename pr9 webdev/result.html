<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>

</head>

<body>

    <div class="navbar">

        <div class="logo">

            <img src="studenthublogo.png" alt="Student Hub Logo">

            <h1>Student Hub</h1>

        </div>

        <div class="links">

            <a href="home.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="courses.html">Courses</a> |
            <a href="admission.html">Admission</a> |
            <a href="timetable.html">Time Table</a> |
            <a href="events.html">Events</a> |
            <a href="result.html">Result</a> |
            <a href="help.html">Help</a> |
            <a href="login.html">Login</a>

        </div>

    </div>


    <div class="main">

        <div class="heading">

            <h1>
                Semester Result
            </h1>

            <p>
                Academic Year 2026-27
            </p>

        </div>


        <!-- Search, Filter and Sort -->

        <div class="result-controls">

            <input
                type="text"
                id="studentSearch"
                placeholder="Search student..."
            >

            <select id="courseFilter">

                <option value="all">All Courses</option>

                <option value="CSE">CSE</option>

                <option value="IT">IT</option>

                <option value="AIDS">AIDS</option>

                <option value="ECE">ECE</option>

            </select>


            <select id="yearFilter">

                <option value="all">All Years</option>

                <option value="1">Year 1</option>

                <option value="2">Year 2</option>

                <option value="3">Year 3</option>

                <option value="4">Year 4</option>

            </select>


            <select id="studentSort">

                <option value="default">Sort By</option>

                <option value="nameAsc">Name (A-Z)</option>

                <option value="nameDesc">Name (Z-A)</option>

                <option value="cgpaAsc">CGPA (Low to High)</option>

                <option value="cgpaDesc">CGPA (High to Low)</option>

            </select>

        </div>


        <!-- Loading Message -->

        <p id="studentLoading">
            Loading student results...
        </p>


        <!-- Error Message -->

        <p id="studentError">
        </p>


        <!-- Student Results -->

        <div id="studentResults">

        </div>


        <!-- Pagination -->

        <div class="pagination" id="studentPagination">

        </div>

    </div>

</body>

</html>
